<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torneo de Fútbol CMBP · Marcador</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green:      #00c853;
    --green-dim:  #009624;
    --yellow:     #ffd600;
    --yellow-dim: #c7a500;
    --red:        #ff1744;
    --bg:         #080c09;
    --surface:    #0f1710;
    --surface2:   #162018;
    --border:     rgba(0,200,83,0.13);
    --border-y:   rgba(255,214,0,0.18);
    --text:       #edf5ee;
    --muted:      #4e6e52;
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── BACKGROUND ── */
  body::before {
    content:'';
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0,200,83,0.07) 0%, transparent 70%),
      repeating-linear-gradient(0deg, transparent, transparent 59px, rgba(0,200,83,0.025) 59px, rgba(0,200,83,0.025) 60px),
      repeating-linear-gradient(90deg, transparent, transparent 59px, rgba(0,200,83,0.025) 59px, rgba(0,200,83,0.025) 60px);
  }

  /* ── HEADER ── */
  header {
    position:relative; z-index:2;
    padding: 0 1.5rem;
    height: 72px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom: 1px solid var(--border);
    background: rgba(8,12,9,0.85);
    backdrop-filter: blur(12px);
  }

  .header-left { display:flex; align-items:center; gap:14px; }

  .emblem {
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,214,0,0.12), transparent 70%);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }

  .logo-text {
    display:flex; flex-direction:column; line-height:1;
  }
  .logo-main {
    font-family:'Bebas Neue', sans-serif;
    font-size:1.6rem; letter-spacing:3px;
    color: var(--yellow);
  }
  .logo-sub {
    font-family:'Barlow Condensed', sans-serif;
    font-size:0.6rem; letter-spacing:3px; text-transform:uppercase;
    color: var(--muted);
  }

  .live-badge {
    display:flex; align-items:center; gap:7px;
    font-family:'Barlow Condensed', sans-serif;
    font-size:0.7rem; letter-spacing:2px; text-transform:uppercase;
    color: var(--green);
    border:1px solid rgba(0,200,83,0.25);
    padding:4px 12px; border-radius:20px;
    background:rgba(0,200,83,0.07);
  }
  .live-dot {
    width:7px; height:7px; border-radius:50%;
    background:var(--green);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.3; transform:scale(0.7); }
  }

  /* ── HERO BANNER ── */
  .hero {
    position:relative; z-index:1;
    text-align:center; padding:2.5rem 1.5rem 1.5rem;
    border-bottom:1px solid var(--border-y);
  }
  .hero-flag {
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-bottom:0.5rem;
  }
  .flag-stripe {
    height:3px; width:40px; border-radius:2px;
  }
  .flag-stripe.g { background:var(--green); }
  .flag-stripe.y { background:var(--yellow); }

  .hero-title {
    font-family:'Bebas Neue', sans-serif;
    font-size:clamp(2.2rem,8vw,4rem);
    letter-spacing:6px;
    background: linear-gradient(135deg, var(--yellow) 0%, #fff8aa 40%, var(--green) 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
    line-height:1;
  }
  .hero-sub {
    font-family:'Barlow Condensed', sans-serif;
    font-size:0.75rem; letter-spacing:4px; text-transform:uppercase;
    color:var(--muted); margin-top:6px;
  }

  /* ── TABS (categories) ── */
  .tabs-wrap {
    position:relative; z-index:1;
    display:flex; justify-content:center; gap:6px;
    padding:1.25rem 1.5rem 0;
  }
  .tab {
    font-family:'Barlow Condensed', sans-serif;
    font-size:0.8rem; letter-spacing:2px; text-transform:uppercase;
    font-weight:700;
    padding:7px 20px; border-radius:6px;
    border: 1px solid var(--border);
    background:transparent; color:var(--muted);
    cursor:pointer; transition:all 0.2s;
  }
  .tab:hover { color:var(--text); border-color:rgba(0,200,83,0.3); }
  .tab.active {
    background:var(--yellow); color:#000;
    border-color:var(--yellow);
  }

  /* ── MAIN ── */
  main {
    position:relative; z-index:1;
    max-width:680px; margin:0 auto;
    padding:1.5rem;
  }

  /* Goleadores panel breaks out of the 680px cap */
  #cat-goleadores {
    width: calc(100vw - 3rem);
    max-width: 1020px;
    margin-left: 50%;
    transform: translateX(-50%);
  }

  .category-panel { display:none; }
  .category-panel.active { display:block; }

  .phase-title {
    font-family:'Bebas Neue', sans-serif;
    font-size:0.85rem; letter-spacing:4px;
    color:var(--muted); text-transform:uppercase;
    margin:1.5rem 0 0.75rem;
    display:flex; align-items:center; gap:12px;
  }
  .phase-title::before {
    content:''; width:3px; height:14px;
    border-radius:2px; background:var(--yellow);
    flex-shrink:0;
  }
  .phase-title::after {
    content:''; flex:1; height:1px; background:var(--border);
  }

  /* ── MATCH CARD ── */
  .matches { display:flex; flex-direction:column; gap:0.6rem; }

  .match-card {
    background: var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:0.9rem 1.1rem;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:0.75rem;
    animation:fadeUp 0.35s ease both;
    transition:border-color 0.3s;
  }
  @keyframes fadeUp {
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:none}
  }
  .match-card.live   { border:2px solid rgba(0,200,83,0.7); background:rgba(0,200,83,0.04); box-shadow:0 0 16px rgba(0,200,83,0.12); }
  .match-card.finished{ opacity:0.72; }
  .match-card.finished.card-final   { opacity:1; }
  .match-card.finished.card-tercero { opacity:1; }
  .match-card.pending { opacity:0.5; }

  .team { display:flex; flex-direction:column; gap:2px; }
  .team.right { text-align:right; align-items:flex-end; }
  .team-name {
    font-family:'Barlow Condensed', sans-serif;
    font-size:1rem; font-weight:700; letter-spacing:0.5px;
    color:var(--text); text-transform:uppercase;
  }
  .team.winner .team-name { color:var(--yellow); }
  .team-badge { font-size:0.62rem; color:var(--muted); letter-spacing:1px; }

  .goals-list {
    font-size:0.68rem;
    color:var(--muted);
    font-family:'Barlow Condensed', sans-serif;
    letter-spacing:0.5px;
    line-height:1.5;
    margin-top:2px;
    white-space:pre-line;
  }
  .team.winner .goals-list { color:rgba(255,214,0,0.7); }

  .score-block {
    display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  .score-row { display:flex; align-items:center; gap:5px; }
  .score {
    font-family:'Bebas Neue', sans-serif;
    font-size:2.6rem; line-height:1;
    color:var(--text); min-width:1.4ch; text-align:center;
  }
  .score-sep { font-family:'Bebas Neue', sans-serif; font-size:1.6rem; color:var(--muted); }

  .match-time {
    font-size:0.6rem; font-family:'Barlow Condensed', sans-serif;
    letter-spacing:1.5px; color:var(--muted); text-transform:uppercase;
    margin-bottom:1px; text-align:center;
  }

  .match-status {
    font-size:0.6rem; font-family:'Barlow Condensed', sans-serif;
    letter-spacing:1.5px; text-transform:uppercase;
    padding:2px 8px; border-radius:20px;
  }
  .s-live     { background:rgba(0,200,83,0.15);  color:var(--green); }
  .s-finished { background:rgba(255,255,255,0.05); color:var(--muted); }
  .s-pending  { background:rgba(255,214,0,0.1);  color:var(--yellow); }

  .penalty-note {
    text-align:center;
    font-family:'Bebas Neue', sans-serif;
    font-size:1.2rem; letter-spacing:2px; color:var(--yellow); line-height:1;
    margin-top:5px;
    background:rgba(255,214,0,0.08);
    border:1px solid rgba(255,214,0,0.22);
    border-radius:6px;
    padding:3px 10px;
    white-space:nowrap;
  }
  .pen-label {
    font-family:'Barlow Condensed', sans-serif;
    font-size:0.58rem; text-transform:uppercase; letter-spacing:2px;
    vertical-align:middle; opacity:0.75; color:var(--muted);
  }

  .empty-state {
    text-align:center; padding:3rem 1rem;
    color:var(--muted); font-family:'Barlow Condensed', sans-serif;
    letter-spacing:1px; font-size:0.9rem;
  }
  .empty-icon { font-size:2.5rem; margin-bottom:0.5rem; }

  /* ── FOOTER ── */
  footer {
    position:relative; z-index:1;
    text-align:center; padding:1.25rem;
    font-size:0.68rem; color:var(--muted);
    font-family:'Barlow Condensed', sans-serif; letter-spacing:1.5px;
    border-top:1px solid var(--border);
  }

  /* ── LOADER ── */
  .loader {
    display:flex; justify-content:center; align-items:center;
    height:35vh; flex-direction:column; gap:1rem;
    color:var(--muted); font-family:'Barlow Condensed', sans-serif; letter-spacing:2px;
    font-size:0.8rem;
  }
  .loader-ring {
    width:32px; height:32px; border-radius:50%;
    border:2px solid var(--border);
    border-top-color:var(--yellow);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{transform:rotate(360deg)} }

  /* ── MOBILE ── */
  @media(max-width:600px){
    /* Header */
    header { height:auto; padding:0.65rem 1rem; }
    .emblem img { width:36px; height:36px; }
    .logo-main { font-size:1.15rem; letter-spacing:2px; }
    .logo-sub  { display:none; }
    .live-badge{ font-size:0.62rem; padding:3px 9px; }

    /* Hero */
    .hero { padding:1.4rem 1rem 1rem; }
    .hero-title { font-size:clamp(1.7rem,7vw,2.6rem); letter-spacing:3px; }
    .hero-sub   { font-size:0.62rem; letter-spacing:3px; }

    /* Tabs */
    .tabs-wrap { padding:0.75rem 0.75rem 0; gap:4px; flex-wrap:wrap; justify-content:center; }
    .tab { padding:5px 12px; font-size:0.7rem; letter-spacing:1.5px; }

    /* Main content */
    main { padding:1rem 0.75rem; }

    /* Match cards */
    .match-card { padding:0.65rem 0.75rem; gap:0.5rem; }
    .team-name  { font-size:0.82rem; }
    .score      { font-size:2rem; min-width:1.2ch; }
    .score-sep  { font-size:1.3rem; }
    .goals-list { font-size:0.62rem; }
    .penalty-note { font-size:1rem; padding:2px 7px; }
    .match-time { font-size:0.56rem; }
    .match-status { font-size:0.56rem; }

    /* Phase titles */
    .phase-title { font-size:0.75rem; margin:1rem 0 0.5rem; }
  }

  @media(max-width:360px){
    .logo-main { font-size:1rem; }
    .team-name { font-size:0.75rem; }
    .score     { font-size:1.75rem; }
    .tab       { padding:4px 9px; font-size:0.65rem; }
  }

  /* ── CARD POR FASE (cores da bandeira paraguaia) ── */
  .match-card.card-cuartos {
    border-color: rgba(0,90,200,0.45);
    background: linear-gradient(135deg, rgba(0,90,200,0.07) 0%, rgba(8,12,9,0) 60%);
    opacity: 1 !important;
  }
  .match-card.card-semi {
    border-color: rgba(220,220,220,0.35);
    background: linear-gradient(135deg, rgba(220,220,220,0.05) 0%, rgba(8,12,9,0) 60%);
    opacity: 1 !important;
  }
  .match-card.card-final {
    border-color: rgba(210,30,30,0.55);
    background: linear-gradient(135deg, rgba(210,30,30,0.07) 0%, rgba(8,12,9,0) 60%);
    opacity: 1 !important;
  }
  .match-card.card-tercero {
    border-color: rgba(210,30,30,0.35);
    background: linear-gradient(135deg, rgba(210,30,30,0.05) 0%, rgba(8,12,9,0) 60%);
    opacity: 1 !important;
  }
  .champion-crown { font-size:1rem; margin-bottom:2px; }
  .champion-label {
    font-family:'Barlow Condensed', sans-serif;
    font-size:0.6rem; letter-spacing:2px; text-transform:uppercase;
    color:var(--yellow); margin-top:2px;
  }
  .bronze-label {
    font-family:'Barlow Condensed', sans-serif;
    font-size:0.6rem; letter-spacing:2px; text-transform:uppercase;
    color:#b4823c; margin-top:2px;
  }

  /* ── PÓDIO TAB ── */
  .tab.tab-podio { border-color: rgba(255,214,0,0.4); color: var(--yellow-dim); }
  .tab.tab-podio.active { background:var(--yellow); color:#000; }

  /* ── GOLEADORES TAB ── */
  .tab.tab-gol { border-color: rgba(0,200,83,0.35); color: var(--green-dim); }
  .tab.tab-gol.active { background: var(--green); color:#000; border-color:var(--green); }

  /* ── GOLEADORES PANEL ── */
  .gol-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    padding-top: 0.5rem;
    align-items: start;
  }
  .gol-category {
    background: var(--surface);
    border: 1px solid rgba(0,200,83,0.2);
    border-radius: 12px;
    padding: 1rem 1.1rem;
  }
  .gol-cat-title {
    font-family:'Bebas Neue', sans-serif;
    font-size: 0.9rem; letter-spacing: 3px; text-transform: uppercase;
    color: var(--green); margin-bottom: 0.85rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid rgba(0,200,83,0.15);
    display: flex; align-items: center; gap: 8px;
  }
  .gol-row {
    display: grid;
    grid-template-columns: 2rem 1fr auto;
    align-items: center; gap: 6px;
    padding: 0.45rem 0;
    border-bottom: 1px solid var(--border);
  }
  .gol-row:last-child { border-bottom: none; }
  .gol-rank {
    font-family:'Bebas Neue', sans-serif; font-size: 1.1rem;
    color: var(--muted); text-align: center; line-height: 1;
  }
  .gol-rank.r1 { color: var(--yellow); font-size: 1.25rem; }
  .gol-rank.r2 { color: #c0c8c1; }
  .gol-rank.r3 { color: #b4823c; }
  .gol-player {
    font-family:'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: 0.85rem; letter-spacing: 0.5px;
    text-transform: uppercase; line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .gol-team {
    font-size: 0.6rem; color: var(--muted); letter-spacing: 1px;
    margin-top: 1px; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .gol-count {
    font-family:'Bebas Neue', sans-serif; font-size: 1.6rem;
    color: var(--green); min-width: 1.6ch; text-align: right; line-height: 1;
  }
  .gol-empty {
    text-align: center; padding: 2.5rem 1rem;
    color: var(--muted); font-family:'Barlow Condensed', sans-serif;
    letter-spacing: 1px; font-size: 0.9rem;
  }
  @media(max-width: 680px) {
    .gol-grid  { grid-template-columns: 1fr; }
    #cat-goleadores { width: auto; transform: none; margin-left: 0; }
    .podio-grid { grid-template-columns: 1fr; }
    #cat-podio  { width: auto; transform: none; margin-left: 0; }
  }

  .podio-grid {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1rem;
    padding-top:0.5rem;
    align-items:start;
  }
  #cat-podio {
    width:calc(100vw - 3rem);
    max-width:1020px;
    margin-left:50%;
    transform:translateX(-50%);
  }
  .podio-category {
    background:var(--surface);
    border:1px solid var(--border-y);
    border-radius:12px;
    padding:1.2rem 1.4rem;
  }
  .podio-cat-title {
    font-family:'Bebas Neue', sans-serif;
    font-size:1rem; letter-spacing:3px; text-transform:uppercase;
    color:var(--yellow); margin-bottom:1rem;
    display:flex; align-items:center; gap:10px;
  }
  .podio-cat-title::after {
    content:''; flex:1; height:1px; background:var(--border-y);
  }
  .podio-row {
    display:flex; align-items:center; gap:14px;
    padding:0.6rem 0;
    border-bottom:1px solid var(--border);
  }
  .podio-row:last-child { border-bottom:none; }
  .podio-medal { font-size:1.5rem; width:2rem; text-align:center; flex-shrink:0; }
  .podio-team {
    font-family:'Barlow Condensed', sans-serif;
    font-size:1.1rem; font-weight:700; letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .podio-team.gold   { color:var(--yellow); }
  .podio-team.silver { color:#c0c8c1; }
  .podio-team.bronze { color:#b4823c; }
  .podio-pending {
    font-family:'Barlow Condensed', sans-serif;
    font-size:0.8rem; color:var(--muted); letter-spacing:1px;
    font-style:italic;
  }
  .podio-empty {
    text-align:center; padding:2rem 1rem;
    color:var(--muted); font-family:'Barlow Condensed', sans-serif;
    letter-spacing:1px; font-size:0.85rem;
  }

</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="emblem">
      <img src="https://drive.google.com/thumbnail?id=1z7YF_c_1SWRJfv16VcnVUGGXmUxUCyrZ&sz=w80" alt="CMBP" style="width:44px;height:44px;object-fit:contain;">
    </div>
    <div class="logo-text">
      <div class="logo-main">Torneo de Fútbol CMBP</div>
      <div class="logo-sub">Cooperación Militar Brasileña en el Paraguay</div>
    </div>
  </div>
  <div class="live-badge"><div class="live-dot"></div>En vivo</div>
</header>

<div class="hero">
  <div class="hero-flag">
    <div class="flag-stripe g"></div>
    <div class="flag-stripe y"></div>
    <div class="flag-stripe g"></div>
  </div>
  <div class="hero-title">Torneo de Fútbol CMBP</div>
  <div class="hero-sub">Cooperación · Integración · Amistad</div>
</div>

<div class="tabs-wrap">
  <button class="tab active" onclick="showCategory('oficiales',this)">Oficiales</button>
  <button class="tab" onclick="showCategory('femenino',this)">Femenino</button>
  <button class="tab" onclick="showCategory('suboficiales',this)">Suboficiales</button>
  <button class="tab tab-podio" id="tab-podio" onclick="showCategory('podio',this)" style="display:none">🏆 Pódio</button>
  <button class="tab tab-gol" id="tab-gol" onclick="showCategory('goleadores',this)">⚽ Goleadores</button>
</div>

<main>
  <div id="cat-oficiales"    class="category-panel active"><div class="loader"><div class="loader-ring"></div>Cargando...</div></div>
  <div id="cat-femenino"     class="category-panel"><div class="empty-state"><div class="empty-icon"><img src="https://drive.google.com/thumbnail?id=1z7YF_c_1SWRJfv16VcnVUGGXmUxUCyrZ&sz=w60" style="width:48px;opacity:0.5"></div>Cargando...</div></div>
  <div id="cat-suboficiales" class="category-panel"><div class="empty-state"><div class="empty-icon"><img src="https://drive.google.com/thumbnail?id=1z7YF_c_1SWRJfv16VcnVUGGXmUxUCyrZ&sz=w60" style="width:48px;opacity:0.5"></div>Cargando...</div></div>
  <div id="cat-podio" class="category-panel"><div class="podio-empty">Cargando resultados...</div></div>
  <div id="cat-goleadores" class="category-panel"><div class="gol-empty">Cargando goleadores...</div></div>
</main>

<footer id="last-update">Actualizando...</footer>

<script type="module">
  import { initializeApp }           from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBftlXjMHDtZ8-PSQkdUCADDAu6Xn39yFE",
    authDomain: "torneo-cmbp.firebaseapp.com",
    databaseURL: "https://torneo-cmbp-default-rtdb.firebaseio.com",
    projectId: "torneo-cmbp",
    storageBucket: "torneo-cmbp.firebasestorage.app",
    messagingSenderId: "125647418490",
    appId: "1:125647418490:web:136598ddfb2b04cb0c37c3"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  const PHASE_LABELS = {
    cuartos:'Cuartos de final', semi:'Semifinales',
    tercero:'Disputa por el 3.º lugar', final:'Final'
  };
  const PHASE_ORDER = ['cuartos','semi','tercero','final'];
  const CATEGORIES  = ['oficiales','femenino','suboficiales'];

  window.showCategory = function(cat, btn) {
    document.querySelectorAll('.category-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('cat-'+cat).classList.add('active');
    btn.classList.add('active');
  };

  function statusEl(s) {
    if (s === 'live')     return `<span class="match-status s-live">● En vivo</span>`;
    if (s === 'finished') return `<span class="match-status s-finished">Finalizado</span>`;
    return `<span class="match-status s-pending">Por jugar</span>`;
  }

  function getWinner(m) {
    if (m.status !== 'finished') return null;
    if (m.penalty) return Number(m.pen1) > Number(m.pen2) ? m.team1 : m.team2;
    if (Number(m.score1) > Number(m.score2)) return m.team1;
    if (Number(m.score2) > Number(m.score1)) return m.team2;
    return null;
  }
  function getLoser(m) {
    const w = getWinner(m);
    if (!w) return null;
    return w === m.team1 ? m.team2 : m.team1;
  }

  function renderCategory(catId, matches) {
    const el = document.getElementById('cat-'+catId);
    if (!matches || !Object.keys(matches).length) {
      el.innerHTML = `<div class="empty-state"><div class="empty-icon"><img src="https://drive.google.com/thumbnail?id=1z7YF_c_1SWRJfv16VcnVUGGXmUxUCyrZ&sz=w60" style="width:48px;opacity:0.5"></div>Sin partidos registrados aún.</div>`;
      return;
    }
    const byPhase = {};
    Object.entries(matches).forEach(([id,m]) => {
      if (!byPhase[m.phase]) byPhase[m.phase] = [];
      byPhase[m.phase].push({id,...m});
    });
    let html = '';
    PHASE_ORDER.forEach(phase => {
      if (!byPhase[phase]) return;
      const list = byPhase[phase].sort((a,b)=>(a.order||0)-(b.order||0));
      html += `<div class="phase-title">${PHASE_LABELS[phase]||phase}</div><div class="matches">`;
      list.forEach(m => {
        const isFinal   = phase === 'final'   && m.status === 'finished';
        const isTercero = phase === 'tercero' && m.status === 'finished';
        const s1  = m.status==='pending'?'–':(m.score1??0);
        const s2  = m.status==='pending'?'–':(m.score2??0);
        const w1  = m.status==='finished' && (m.penalty ? Number(m.pen1)>Number(m.pen2) : Number(m.score1)>Number(m.score2));
        const w2  = m.status==='finished' && (m.penalty ? Number(m.pen2)>Number(m.pen1) : Number(m.score2)>Number(m.score1));
        const crown1 = isFinal   && w1 ? `<div class="champion-crown">👑</div>` : isFinal && !w1 && w2 ? `<div class="champion-crown">🥈</div>` : isTercero && w1 ? `<div class="champion-crown">🥉</div>` : '';
        const crown2 = isFinal   && w2 ? `<div class="champion-crown">👑</div>` : isFinal && !w2 && w1 ? `<div class="champion-crown">🥈</div>` : isTercero && w2 ? `<div class="champion-crown">🥉</div>` : '';
        const label1 = isFinal   && w1 ? `<div class="champion-label">Campeón</div>` : isFinal && !w1 && w2 ? `<div class="champion-label" style="color:#c0c8c1">2.º lugar</div>` : isTercero && w1 ? `<div class="bronze-label">3.er lugar</div>` : '';
        const label2 = isFinal   && w2 ? `<div class="champion-label">Campeón</div>` : isFinal && !w2 && w1 ? `<div class="champion-label" style="color:#c0c8c1">2.º lugar</div>` : isTercero && w2 ? `<div class="bronze-label">3.er lugar</div>` : '';

        const extraClass = phase==='cuartos' ? 'card-cuartos' : phase==='semi' ? 'card-semi' : phase==='final' ? 'card-final' : phase==='tercero' ? 'card-tercero' : '';

        html += `
          <div class="match-card ${m.status||'pending'} ${extraClass}">
            <div class="team ${w1?'winner':''}">
              ${crown1}
              <div class="team-name">${m.team1||'Equipo A'}</div>
              ${m.goals1 ? `<div class="goals-list">${compactGoals(m.goals1)}</div>` : ''}
              ${label1}
            </div>
            <div class="score-block">
              <div class="match-time">${m.code ? `<span style="color:var(--yellow);font-weight:700;letter-spacing:1px">${m.code}</span>${m.time?'<br>'+m.time:''}` : (m.time||'')}</div>
              <div class="score-row">
                <div class="score">${s1}</div>
                <div class="score-sep">×</div>
                <div class="score">${s2}</div>
              </div>
              ${m.penalty ? `<div class="penalty-note">${m.pen1} × ${m.pen2} <span class="pen-label">pen.</span></div>` : ''}
              ${statusEl(m.status)}
            </div>
            <div class="team right ${w2?'winner':''}">
              ${crown2}
              <div class="team-name">${m.team2||'Equipo B'}</div>
              ${m.goals2 ? `<div class="goals-list">${compactGoals(m.goals2)}</div>` : ''}
              ${label2}
            </div>
          </div>`;
      });
      html += `</div>`;
    });
    el.innerHTML = html;
  }

  const CAT_LABELS = { oficiales:'Oficiales', femenino:'Femenino', suboficiales:'Suboficiales' };
  const allMatches = {};

  function toArr(val) {
    if (!val) return [];
    return Array.isArray(val) ? val : Object.values(val);
  }

  // Groups repeated goal-scorer names: "Benites\nBenites\nLopez" → "Benites (2)\nLopez"
  function compactGoals(text) {
    if (!text) return '';
    const counts = {}, order = [];
    text.split('\n').forEach(raw => {
      const n = raw.trim();
      if (!n) return;
      if (!counts[n]) { counts[n] = 0; order.push(n); }
      counts[n]++;
    });
    return order.map(n => counts[n] > 1 ? `${n} (${counts[n]})` : n).join('\n');
  }

  function renderGoleadores() {
    const el = document.getElementById('cat-goleadores');
    if (!el) return;
    let html = '<div class="gol-grid">';

    CATEGORIES.forEach(cat => {
      const scorers = {};
      Object.values(allMatches[cat] || {}).forEach(m => {
        toArr(m.goalsData).forEach(g => {
          if (g.ownGoal) return;
          const team = g.teamSlot == 1 ? (m.team1 || '?') : (m.team2 || '?');
          const key  = `${g.player}||${team}`;
          scorers[key] = (scorers[key] || 0) + 1;
        });
      });

      const list = Object.entries(scorers)
        .map(([k, count]) => { const [player, team] = k.split('||'); return { player, team, count }; })
        .sort((a, b) => b.count - a.count);

      html += `<div class="gol-category">
        <div class="gol-cat-title">⚽ ${CAT_LABELS[cat]}</div>`;
      if (!list.length) {
        html += `<div style="color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:0.75rem;letter-spacing:1px;padding:0.8rem 0;text-align:center;">Sin goles registrados</div>`;
      } else {
        list.forEach(({ player, team, count }, i) => {
          const rankClass = i === 0 ? 'r1' : i === 1 ? 'r2' : i === 2 ? 'r3' : '';
          const rankLabel = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : String(i + 1);
          html += `<div class="gol-row">
            <div class="gol-rank ${rankClass}">${rankLabel}</div>
            <div>
              <div class="gol-player">${player}</div>
              <div class="gol-team">${team}</div>
            </div>
            <div class="gol-count">${count}</div>
          </div>`;
        });
      }
      html += `</div>`;
    });

    html += '</div>';
    el.innerHTML = html;
  }

  function renderPodio() {
    const el = document.getElementById('cat-podio');
    let hasAny = false;
    let html = '<div class="podio-grid">';
    CATEGORIES.forEach(cat => {
      const matches  = allMatches[cat] || {};
      const finalM   = Object.values(matches).find(m => m.phase === 'final'   && m.status === 'finished');
      const terceroM = Object.values(matches).find(m => m.phase === 'tercero' && m.status === 'finished');
      if (finalM || terceroM) hasAny = true;
      const champion = finalM   ? getWinner(finalM)   : null;
      const runner   = finalM   ? getLoser(finalM)    : null;
      const third    = terceroM ? getWinner(terceroM)  : null;
      html += `
        <div class="podio-category">
          <div class="podio-cat-title">${CAT_LABELS[cat]||cat}</div>
          <div class="podio-row">
            <div class="podio-medal">🥇</div>
            <div class="podio-team gold">${champion || '<span class="podio-pending">Por definir</span>'}</div>
          </div>
          <div class="podio-row">
            <div class="podio-medal">🥈</div>
            <div class="podio-team silver">${runner || '<span class="podio-pending">Por definir</span>'}</div>
          </div>
          <div class="podio-row">
            <div class="podio-medal">🥉</div>
            <div class="podio-team bronze">${third || '<span class="podio-pending">Por definir</span>'}</div>
          </div>
        </div>`;
    });
    html += '</div>';
    el.innerHTML = hasAny ? html : '<div class="podio-empty">Los resultados finales aparecerán aquí.</div>';
    document.getElementById('tab-podio').style.display = hasAny ? '' : 'none';
  }

  CATEGORIES.forEach(cat => {
    onValue(ref(db, `matches/${cat}`), snap => {
      allMatches[cat] = snap.val() || {};
      renderCategory(cat, allMatches[cat]);
      renderPodio();
      renderGoleadores();
      const now = new Date().toLocaleTimeString('es-PY',{hour:'2-digit',minute:'2-digit'});
      document.getElementById('last-update').textContent = `Última actualización: ${now}`;
    });
  });
</script>
</body>
</html>
