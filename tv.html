<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torneo de Fútbol CMBP · TV</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ── VARIABLES & RESET ── */
  :root {
    --green:#00c853; --green-dim:#009624; --green-faint:rgba(0,200,83,0.08);
    --yellow:#ffd600; --yellow-dim:#c7a500; --yellow-faint:rgba(255,214,0,0.08);
    --red:#ff1744;    --red-faint:rgba(255,23,68,0.12);
    --blue:#40c4ff;
    --bg:#060a07;     --surface:#0d1510; --surface2:#131c15; --surface3:#182219;
    --border:rgba(0,200,83,0.12); --border2:rgba(0,200,83,0.28);
    --border-y:rgba(255,214,0,0.18);
    --text:#edf5ee; --muted:#4e6e52; --muted2:#3a5440;
    --radius:10px;
    --slide-dur: 20s;   /* time each slide is shown */
  }
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100%; height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:'Barlow Condensed', sans-serif;
  }

  /* ── BACKGROUND TEXTURE ── */
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse 70% 55% at 50% -5%, rgba(0,200,83,0.07) 0%, transparent 65%),
      repeating-linear-gradient(0deg,  transparent, transparent 59px, rgba(0,200,83,0.022) 59px, rgba(0,200,83,0.022) 60px),
      repeating-linear-gradient(90deg, transparent, transparent 59px, rgba(0,200,83,0.022) 59px, rgba(0,200,83,0.022) 60px);
  }

  /* ── HEADER ── */
  #tv-header {
    position: relative; z-index: 10;
    height: 68px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2.5rem;
    border-bottom: 1px solid var(--border-y);
    background: rgba(6,10,7,0.96);
    backdrop-filter: blur(12px);
    flex-shrink: 0;
  }
  .hdr-logo {
    font-family:'Bebas Neue', sans-serif;
    font-size: 2rem; letter-spacing: 4px; color: var(--yellow);
  }
  .hdr-logo span {
    color: var(--muted); font-size: 1rem; letter-spacing: 3px;
    margin-left: 14px; vertical-align: middle;
  }
  .hdr-slide-name {
    font-family:'Bebas Neue', sans-serif;
    font-size: 1.9rem; letter-spacing: 5px;
    color: var(--green);
    text-shadow: 0 0 30px rgba(0,200,83,0.35);
    transition: opacity 0.4s;
  }
  .hdr-dots {
    display: flex; align-items: center; gap: 10px;
  }
  .hdr-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--muted2);
    transition: background 0.3s, transform 0.3s;
  }
  .hdr-dot.active {
    background: var(--yellow);
    transform: scale(1.35);
    box-shadow: 0 0 10px rgba(255,214,0,0.5);
  }

  /* ── PROGRESS BAR ── */
  #progress-bar {
    position: relative; z-index: 10;
    height: 3px;
    background: var(--surface2);
    flex-shrink: 0;
    overflow: hidden;
  }
  #progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green), var(--yellow));
    width: 0%;
    transition: width 0.25s linear;
  }

  /* ── MAIN STAGE ── */
  #stage {
    position: relative; z-index: 1;
    flex: 1; overflow: hidden;
    display: flex; flex-direction: column;
  }

  /* body is flex column */
  body { display: flex; flex-direction: column; }

  /* ── SLIDES ── */
  .slide {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    padding: 1.6rem 2.5rem 1.4rem;
    gap: 1rem;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .slide.active {
    display: flex;
    opacity: 1;
  }
  .slide.fade-out { opacity: 0; }

  /* ── SLIDE TITLE ── */
  .slide-title {
    font-family:'Bebas Neue', sans-serif;
    font-size: 1.35rem; letter-spacing: 6px; color: var(--yellow);
    text-transform: uppercase;
    display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
  }
  .slide-title::after {
    content:''; flex:1; height:1px;
    background: linear-gradient(90deg, var(--border-y), transparent);
  }

  /* ══════════════════════════════
     BRACKET LAYOUT
  ══════════════════════════════ */
  .bracket-wrap {
    flex: 1;
    display: flex;
    gap: 0;
    align-items: stretch;
    overflow: hidden;
    min-height: 0;
  }

  /* Column */
  .bracket-col {
    display: flex;
    flex-direction: column;
    flex: 1;
    position: relative;
  }

  .bracket-col-header {
    font-family:'Bebas Neue', sans-serif;
    font-size: 0.88rem; letter-spacing: 4px;
    color: var(--muted);
    text-align: center;
    padding-bottom: 0.65rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0.55rem;
    flex-shrink: 0;
  }
  .bracket-col-header.col-semi   { color: var(--blue);   border-bottom-color:rgba(64,196,255,0.25); }
  .bracket-col-header.col-final  { color: var(--yellow); border-bottom-color:rgba(255,214,0,0.3);  }

  .bracket-col-matches {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    gap: 0.55rem;
    min-height: 0;
  }

  /* Connector lines between columns */
  .bracket-connector {
    width: 36px;
    position: relative;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    padding-top: 2.2rem; /* align with col matches area (after header) */
  }
  .connector-pair {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
  }
  .connector-pair::before {
    content:'';
    position:absolute; right:0; top:25%; bottom:25%;
    width:1px;
    background: linear-gradient(180deg, transparent, var(--border2), transparent);
  }
  .connector-pair::after {
    content:'';
    position:absolute; right:0; top:50%;
    width:18px; height:1px;
    background: var(--border2);
    transform: translateX(50%);
  }

  /* ── MATCH CARD ── */
  .bk-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    flex-shrink: 0;
    transition: border-color 0.3s;
  }
  @keyframes bk-live-pulse {
    0%, 100% { box-shadow: 0 0 6px  rgba(255,23,68,0.2),  0 0 0 0px rgba(255,23,68,0);    border-color: rgba(255,23,68,0.7); }
    50%       { box-shadow: 0 0 28px rgba(255,23,68,0.55), 0 0 0 5px rgba(255,23,68,0.12); border-color: rgba(255,23,68,1);   }
  }
  .bk-card.live   { animation: bk-live-pulse 1.8s ease-in-out infinite; }
  .bk-card.finished { border-color: var(--border2); }
  .bk-card.empty  { border-style:dashed; border-color: var(--border); background: transparent; opacity:0.5; }

  .bk-phase-bar {
    height: 3px;
    background: var(--border);
  }
  .bk-card.live    .bk-phase-bar { background: var(--red); }
  .bk-card.finished .bk-phase-bar { background: linear-gradient(90deg, var(--green), var(--green-dim)); }

  .bk-body {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 4px;
    padding: 0.5rem 0.7rem;
  }

  .bk-team {
    display: flex; flex-direction: column; gap: 1px;
  }
  .bk-team.right { text-align: right; align-items: flex-end; }

  .bk-team-name {
    font-family:'Barlow Condensed', sans-serif;
    font-size: 0.88rem; font-weight: 700; letter-spacing: 0.5px;
    line-height: 1.15; color: var(--text);
    white-space: nowrap; overflow: hidden;
    min-width: 0;
  }
  .bk-team-name.winner { color: var(--yellow); }
  .bk-team-name.tbd    { color: var(--muted); font-style:italic; font-weight:400; font-size:0.78rem; }

  .bk-team-goals {
    font-family:'Barlow Condensed', sans-serif;
    font-size: 0.6rem; color: var(--muted); letter-spacing: 0.3px;
    line-height: 1.3; white-space: pre-line;
  }

  .bk-score-block {
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    min-width: 72px;
  }
  .bk-score-row {
    display: flex; align-items: center; gap: 5px;
  }
  .bk-score {
    font-family:'Bebas Neue', sans-serif;
    font-size: 1.9rem; min-width: 1ch; text-align: center;
    line-height: 1;
  }
  .bk-score.winner { color: var(--yellow); }
  .bk-sep {
    font-family:'Bebas Neue', sans-serif;
    font-size: 1.2rem; color: var(--muted);
  }
  .bk-pen {
    font-family:'Barlow Condensed', sans-serif;
    font-size: 0.65rem; color: var(--yellow);
    background: rgba(255,214,0,0.1);
    border: 1px solid rgba(255,214,0,0.22);
    border-radius: 4px; padding: 1px 6px;
    letter-spacing: 1.5px;
    white-space: nowrap;
  }
  .bk-status {
    font-family:'Barlow Condensed', sans-serif;
    font-size: 0.58rem; letter-spacing: 2px; text-transform: uppercase;
  }
  .bk-status.live    { color: var(--red);   animation: blink 1.2s step-end infinite; }
  .bk-status.pending { color: var(--muted); }
  .bk-status.done    { color: var(--green); }

  .bk-time {
    font-family:'Barlow Condensed', sans-serif;
    font-size: 0.6rem; color: var(--muted); letter-spacing: 1px;
    margin-bottom: 1px;
  }

  .bk-card-empty-inner {
    padding: 0.8rem 0.7rem;
    text-align: center;
    font-family:'Barlow Condensed',sans-serif;
    font-size:0.75rem; color:var(--muted); letter-spacing:1.5px;
  }

  @keyframes blink {
    0%,100%{opacity:1} 50%{opacity:0.35}
  }

  /* Crown for winner */
  .bk-crown {
    font-size: 0.7rem; line-height: 1;
  }

  /* FINAL column: Final on top, 3er lugar below, separated */
  .bracket-col-final-matches {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
    min-height: 0;
  }
  .bk-final-group {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.4rem;
  }
  .bk-final-label {
    font-family:'Bebas Neue',sans-serif;
    font-size:0.75rem; letter-spacing:3px; color:var(--yellow);
    text-align:center; margin-bottom:2px;
  }
  .bk-tercero-label {
    font-family:'Bebas Neue',sans-serif;
    font-size:0.75rem; letter-spacing:3px; color:var(--muted);
    text-align:center; margin-bottom:2px;
  }
  .bk-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 0.35rem 0;
    flex-shrink:0;
  }

  /* ══════════════════════════════
     GOLEADORES SLIDE
  ══════════════════════════════ */
  .gol-wrap {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
    min-height: 0;
  }

  .gol-col {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  .gol-col-hdr {
    padding: 0.85rem 1rem 0.7rem;
    border-bottom: 3px solid var(--yellow);
    background: linear-gradient(180deg, rgba(255,214,0,0.07) 0%, transparent 100%);
    text-align: center;
    flex-shrink: 0;
  }
  .gol-cat-name {
    font-family:'Bebas Neue',sans-serif;
    font-size: 1.9rem; letter-spacing: 7px; line-height: 1;
    color: var(--yellow);
    text-shadow: 0 0 22px rgba(255,214,0,0.35);
  }
  .gol-cat-sub {
    font-family:'Barlow Condensed',sans-serif;
    font-size: 0.62rem; letter-spacing: 3px; color: var(--muted);
    text-transform: uppercase; margin-top: 3px;
  }

  .gol-list {
    flex:1; overflow:hidden;
    padding: 0.5rem 0;
  }

  .gol-row {
    display: grid;
    grid-template-columns: 2rem 1fr 2.5rem;
    align-items: center;
    padding: 0.42rem 1rem;
    gap: 8px;
    transition: background 0.15s;
    border-bottom: 1px solid rgba(0,200,83,0.05);
  }
  .gol-row:last-child { border-bottom: none; }

  .gol-rank {
    font-family:'Bebas Neue',sans-serif;
    font-size: 1.1rem; color: var(--muted);
    text-align: center; line-height: 1;
  }
  .gol-row:nth-child(1) .gol-rank { color: var(--yellow); font-size:1.25rem; }
  .gol-row:nth-child(2) .gol-rank { color: #b0b0b0; }
  .gol-row:nth-child(3) .gol-rank { color: #cd7f32; }

  .gol-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .gol-name {
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700; font-size:0.9rem; letter-spacing:0.3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    color:var(--text);
  }
  .gol-team {
    font-family:'Barlow Condensed',sans-serif;
    font-size:0.65rem; color:var(--muted); letter-spacing:0.5px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .gol-count {
    font-family:'Bebas Neue',sans-serif;
    font-size:1.7rem; color:var(--green);
    text-align:right; line-height:1;
  }
  .gol-count-unit {
    font-family:'Barlow Condensed',sans-serif;
    font-size:0.6rem; color:var(--muted); letter-spacing:1px;
    text-align:right; line-height:1;
  }

  .gol-empty {
    flex:1; display:flex; align-items:center; justify-content:center;
    font-family:'Barlow Condensed',sans-serif;
    font-size:0.78rem; color:var(--muted); letter-spacing:2px;
    text-transform:uppercase; padding:1.5rem;
    text-align:center;
  }

  /* ── LIVE TICKER (bottom strip) ── */
  #live-ticker {
    position: relative; z-index: 10;
    height: 34px; flex-shrink: 0;
    background: rgba(6,10,7,0.97);
    border-top: 1px solid var(--border);
    display: flex; align-items: center;
    overflow: hidden;
  }
  .ticker-label {
    flex-shrink: 0;
    background: var(--red);
    color: #fff;
    font-family:'Bebas Neue',sans-serif;
    font-size:0.82rem; letter-spacing:3px;
    padding: 0 14px;
    height: 100%; display:flex; align-items:center;
    margin-right: 10px;
  }
  .ticker-track {
    flex:1; overflow:hidden;
    position:relative;
    white-space:nowrap;
  }
  .ticker-inner {
    display:inline-block;
    animation: ticker-scroll 30s linear infinite;
    font-family:'Barlow Condensed',sans-serif;
    font-size:0.78rem; letter-spacing:1.5px;
    color: var(--text);
  }
  @keyframes ticker-scroll {
    0%   { transform: translateX(100vw); }
    100% { transform: translateX(-100%); }
  }

  /* ── CLOCK ── */
  #clock {
    flex-shrink:0;
    font-family:'Bebas Neue',sans-serif;
    font-size:1.05rem; letter-spacing:3px; color:var(--muted);
    padding: 0 18px;
  }

  /* ══════════════════════════════
     EVENT POPUP
  ══════════════════════════════ */
  #tv-popup-overlay {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(4px);
  }
  #tv-popup-overlay.show { opacity: 1; }

  #tv-popup {
    position: relative;
    background: linear-gradient(145deg, #0d1510 0%, #182219 100%);
    border: 2px solid var(--yellow);
    border-radius: 20px;
    padding: 2.2rem 3rem 2.5rem;
    min-width: 480px; max-width: 620px;
    text-align: center;
    box-shadow:
      0 0 70px rgba(255,214,0,0.22),
      0 0 140px rgba(255,214,0,0.07),
      inset 0 1px 0 rgba(255,255,255,0.04);
    animation: popup-bounce 0.45s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  #tv-popup.popup-goal     { border-color:var(--green); box-shadow:0 0 70px rgba(0,200,83,0.28),0 0 140px rgba(0,200,83,0.08); }
  #tv-popup.popup-live     { border-color:var(--green); box-shadow:0 0 70px rgba(0,200,83,0.28),0 0 140px rgba(0,200,83,0.08); }
  #tv-popup.popup-finished { border-color:#40c4ff;      box-shadow:0 0 70px rgba(64,196,255,0.25),0 0 140px rgba(64,196,255,0.07); }

  @keyframes popup-bounce {
    from { transform: scale(0.82) translateY(24px); opacity: 0; }
    to   { transform: scale(1)    translateY(0);    opacity: 1; }
  }

  .popup-icon    { font-size:3.6rem; line-height:1; margin-bottom:0.4rem; }
  .popup-eyebrow {
    font-family:'Barlow Condensed',sans-serif;
    font-size:0.75rem; letter-spacing:5px; color:var(--muted);
    text-transform:uppercase; margin-bottom:0.25rem;
  }
  .popup-headline {
    font-family:'Bebas Neue',sans-serif;
    font-size:3.8rem; letter-spacing:6px; color:var(--yellow); line-height:1;
  }
  #tv-popup.popup-goal     .popup-headline { color:var(--green); text-shadow:0 0 30px rgba(0,200,83,0.5); }
  #tv-popup.popup-live     .popup-headline { color:var(--green); }
  #tv-popup.popup-finished .popup-headline { color:#40c4ff; }

  .popup-scorer {
    font-family:'Barlow Condensed',sans-serif;
    font-size:2rem; font-weight:700; letter-spacing:2px;
    color:var(--text); margin-top:0.55rem;
    text-transform:uppercase;
  }
  .popup-team-tag {
    font-family:'Barlow Condensed',sans-serif;
    font-size:0.8rem; letter-spacing:2.5px; color:var(--green);
    text-transform:uppercase; margin-top:2px;
  }
  .popup-vs {
    font-family:'Barlow Condensed',sans-serif;
    font-size:0.95rem; letter-spacing:2px; color:var(--muted);
    text-transform:uppercase; margin-top:0.5rem;
  }
  .popup-big-score {
    font-family:'Bebas Neue',sans-serif;
    font-size:4.5rem; letter-spacing:10px; color:var(--yellow); line-height:1;
    margin:0.4rem 0;
  }
  .popup-match-teams {
    font-family:'Barlow Condensed',sans-serif;
    font-size:1.3rem; font-weight:700; letter-spacing:1.5px;
    color:var(--text); text-transform:uppercase; margin-top:0.3rem;
  }
  .popup-sub {
    font-family:'Barlow Condensed',sans-serif;
    font-size:0.78rem; letter-spacing:2px; color:var(--muted);
    text-transform:uppercase; margin-top:0.3rem;
  }
  .popup-winner-tag {
    display:inline-block;
    font-family:'Barlow Condensed',sans-serif;
    font-size:0.85rem; letter-spacing:2.5px;
    color:#000; background:var(--yellow);
    border-radius:20px; padding:3px 14px; margin-top:0.6rem;
    text-transform:uppercase;
  }
  .popup-progress {
    position:absolute; bottom:0; left:0; right:0; height:5px;
    background:rgba(255,255,255,0.08);
    border-radius:0 0 18px 18px; overflow:hidden;
  }
  .popup-progress-fill {
    height:100%; width:100%;
    background: var(--yellow);
    border-radius:0 0 18px 18px;
  }
  #tv-popup.popup-goal     .popup-progress-fill { background:var(--green); }
  #tv-popup.popup-live     .popup-progress-fill { background:var(--green); }
  #tv-popup.popup-finished .popup-progress-fill { background:#40c4ff; }

  /* ── GOAL CELEBRATION ANIMATION ── */
  @keyframes goal-ball-burst {
    0%   { transform: translate(-50%,-50%) scale(0.2) rotate(0deg); opacity:1; }
    75%  { opacity:1; }
    100% { transform: translate(calc(-50% + var(--bx)), calc(-50% + var(--by))) scale(1.1) rotate(var(--br)); opacity:0; }
  }
  @keyframes goal-flash {
    0%,100% { opacity:0; }
    10%,30% { opacity:0.18; }
    20%     { opacity:0.06; }
  }
  @keyframes goal-headline-pop {
    0%   { transform: scale(1); }
    18%  { transform: scale(1.18); }
    36%  { transform: scale(1); }
    52%  { transform: scale(1.10); }
    68%  { transform: scale(1); }
  }
  @keyframes goal-crowd-bar {
    0%,100% { transform: scaleY(0.4); opacity:0.5; }
    50%     { transform: scaleY(1.0); opacity:1; }
  }
  .goal-burst-item {
    position: absolute;
    top: 50%; left: 50%;
    font-size: var(--bsize, 1.8rem);
    pointer-events: none;
    z-index: 215;
    line-height: 1;
    animation: goal-ball-burst var(--bdur, 1s) cubic-bezier(0.15,0.85,0.3,1) var(--bdel, 0s) both;
  }
  .goal-flash-overlay {
    position: absolute; inset: 0;
    background: rgba(0,200,83,0.25);
    border-radius: inherit;
    pointer-events: none;
    z-index: 202;
    animation: goal-flash 0.7s ease both;
  }
  .popup-goal-headline-anim {
    display: inline-block;
    animation: goal-headline-pop 1.4s ease both 0.1s;
  }
  .goal-crowd {

<!-- ══════════ FIREBASE + LOGIC ══════════ -->
<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ── Config ── */
const firebaseConfig = {
  apiKey:            "AIzaSyBftlXjMHDtZ8-PSQkdUCADDAu6Xn39yFE",
  authDomain:        "torneo-cmbp.firebaseapp.com",
  databaseURL:       "https://torneo-cmbp-default-rtdb.firebaseio.com",
  projectId:         "torneo-cmbp",
  storageBucket:     "torneo-cmbp.firebasestorage.app",
  messagingSenderId: "125647418490",
  appId:             "1:125647418490:web:136598ddfb2b04cb0c37c3"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

/* ── Constants ── */
const CATEGORIES  = ['oficiales','femenino','suboficiales'];
const CAT_LABELS  = { oficiales:'Oficiales', femenino:'Femenino', suboficiales:'Suboficiales' };
const SLIDE_NAMES = ['Oficiales','Femenino','Suboficiales','Goleadores'];
const SLIDE_DURATION_MS = 20000;   // 20 s per slide

/* ── State ── */
const allMatches = { oficiales:{}, femenino:{}, suboficiales:{} };
let currentSlide = 0;
let progressStart = Date.now();
let progressRaf;
let slideTimeout;

/* ── Helpers ── */
function toArr(val) {
  if (!val) return [];
  return Array.isArray(val) ? val : Object.values(val);
}

function getWinner(m) {
  if (m.status !== 'finished') return null;
  if (m.penalty) return Number(m.pen1) > Number(m.pen2) ? m.team1 : m.team2;
  if (Number(m.score1) > Number(m.score2)) return m.team1;
  if (Number(m.score2) > Number(m.score1)) return m.team2;
  return null;
}

function compactGoals(text) {
  if (!text) return '';
  const counts = {}, order = [];
  text.split('\n').forEach(raw => {
    const n = raw.trim(); if (!n) return;
    if (!counts[n]) { counts[n]=0; order.push(n); }
    counts[n]++;
  });
  return order.map(n => counts[n]>1 ? `${n} (${counts[n]})` : n).join('\n');
}

/* ── Match card builder ── */
function matchCard(m, isWideCol) {
  if (!m) {
    return `<div class="bk-card empty"><div class="bk-card-empty-inner">A definir</div></div>`;
  }
  const s1 = Number(m.score1)||0;
  const s2 = Number(m.score2)||0;
  const w = getWinner(m);
  const w1 = w === m.team1;
  const w2 = w === m.team2;

  const t1 = m.team1 || 'Por definir';
  const t2 = m.team2 || 'Por definir';
  const isTbd1 = !m.team1;
  const isTbd2 = !m.team2;

  let statusHtml = '';
  if (m.status === 'live')     statusHtml = `<div class="bk-status live">● En vivo</div>`;
  else if (m.status === 'finished') statusHtml = `<div class="bk-status done">Finalizado</div>`;
  else                              statusHtml = m.time ? `<div class="bk-time">${m.time}</div>` : `<div class="bk-status pending">Por jugar</div>`;

  const penHtml = (m.penalty && m.status==='finished')
    ? `<div class="bk-pen">${m.pen1} × ${m.pen2} pen.</div>` : '';

  const goals1c = compactGoals(m.goals1||'');
  const goals2c = compactGoals(m.goals2||'');
  const goalsHtml1 = goals1c ? `<div class="bk-team-goals">${goals1c}</div>` : '';
  const goalsHtml2 = goals2c ? `<div class="bk-team-goals">${goals2c}</div>` : '';

  return `
    <div class="bk-card ${m.status||'pending'}">
      <div class="bk-phase-bar"></div>
      <div class="bk-body">
        <div class="bk-team">
          <div class="bk-team-name ${w1?'winner':''} ${isTbd1?'tbd':''}">${w1?'👑 ':''}${t1}</div>
          ${goalsHtml1}
        </div>
        <div class="bk-score-block">
          ${statusHtml}
          <div class="bk-score-row">
            <div class="bk-score ${w1?'winner':''}">${m.status!=='pending'?s1:'—'}</div>
            <div class="bk-sep">×</div>
            <div class="bk-score ${w2?'winner':''}">${m.status!=='pending'?s2:'—'}</div>
          </div>
          ${penHtml}
        </div>
        <div class="bk-team right">
          <div class="bk-team-name ${w2?'winner':''} ${isTbd2?'tbd':''}">${w2?'👑 ':''}${t2}</div>
          ${goalsHtml2}
        </div>
      </div>
    </div>`;
}

/* ── Bracket builder ── */
function buildBracket(cat) {
  const el = document.getElementById(`bracket-${cat}`);
  if (!el) return;

  const matches = allMatches[cat] || {};
  const list    = Object.values(matches).sort((a,b) => (a.order||0)-(b.order||0));

  const cuartos  = list.filter(m => m.phase === 'cuartos');
  const semis    = list.filter(m => m.phase === 'semi');
  const finalM   = list.find(m  => m.phase === 'final');
  const terceroM = list.find(m  => m.phase === 'tercero');

  // Ensure we always show at least 2 slots for cuartos / 2 for semis
  while (cuartos.length  < 4) cuartos.push(null);
  while (semis.length    < 2) semis.push(null);

  /* ---------- Cuartos column ---------- */
  let cuartosHtml = '';
  cuartos.forEach(m => { cuartosHtml += matchCard(m); });

  /* ---------- Semi column ---------- */
  let semisHtml = '';
  semis.forEach(m => { semisHtml += matchCard(m); });

  /* ---------- Final column ---------- */
  const finalHtml   = matchCard(finalM || null);
  const terceroHtml = matchCard(terceroM || null);

  el.innerHTML = `
    <!-- Cuartos -->
    <div class="bracket-col">
      <div class="bracket-col-header">Cuartos de Final</div>
      <div class="bracket-col-matches">${cuartosHtml}</div>
    </div>

    <!-- Connector cuartos→semi -->
    <div class="bracket-connector">
      <div class="connector-pair"></div>
      <div class="connector-pair"></div>
    </div>

    <!-- Semi -->
    <div class="bracket-col">
      <div class="bracket-col-header col-semi">Semifinal</div>
      <div class="bracket-col-matches">${semisHtml}</div>
    </div>

    <!-- Connector semi→final -->
    <div class="bracket-connector">
      <div class="connector-pair"></div>
    </div>

    <!-- Final + 3er lugar -->
    <div class="bracket-col">
      <div class="bracket-col-header col-final">Final &amp; 3.º Lugar</div>
      <div class="bracket-col-final-matches">
        <div class="bk-final-group">
          <div class="bk-final-label">🏆 Final</div>
          ${finalHtml}
        </div>
        <div class="bk-divider"></div>
        <div class="bk-final-group">
          <div class="bk-tercero-label">🥉 3.º Lugar</div>
          ${terceroHtml}
        </div>
      </div>
    </div>`;
}

/* ── Goleadores builder ── */
function buildGoleadores() {
  const el = document.getElementById('gol-wrap');
  if (!el) return;
  let html = '';

  CATEGORIES.forEach(cat => {
    const scorers = {};
    Object.values(allMatches[cat]||{}).forEach(m => {
      toArr(m.goalsData).forEach(g => {
        if (g.ownGoal) return;
        const key = (g.player||'').trim();
        if (!key) return;
        if (!scorers[key]) scorers[key] = { name:key, team:'', count:0 };
        scorers[key].count++;
        if (!scorers[key].team && g.teamSlot) {
          scorers[key].team = g.teamSlot === '1' ? (m.team1||'') : (m.team2||'');
        }
      });
    });

    const list = Object.values(scorers).sort((a,b) => b.count-a.count).slice(0,7);

    html += `
      <div class="gol-col">
        <div class="gol-col-hdr">
          <div class="gol-cat-name">${CAT_LABELS[cat]}</div>
          <div class="gol-cat-sub">⚽ Goleadores</div>
        </div>`;

    if (!list.length) {
      html += `<div class="gol-empty">Sin goles registrados</div>`;
    } else {
      html += `<div class="gol-list">`;
      list.forEach((s,i) => {
        html += `
          <div class="gol-row">
            <div class="gol-rank">${i+1}</div>
            <div class="gol-info">
              <div class="gol-name">${s.name}</div>
              <div class="gol-team">${s.team}</div>
            </div>
            <div>
              <div class="gol-count">${s.count}</div>
              <div class="gol-count-unit">gol${s.count!==1?'es':''}</div>
            </div>
          </div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  });

  el.innerHTML = html;
}

/* ── Ticker builder ── */
function buildTicker() {
  const parts = [];
  CATEGORIES.forEach(cat => {
    const liveMatches = Object.values(allMatches[cat]||{}).filter(m=>m.status==='live');
    liveMatches.forEach(m => {
      const s1 = Number(m.score1)||0, s2 = Number(m.score2)||0;
      parts.push(`${CAT_LABELS[cat]}: ${m.team1||'?'} ${s1} × ${s2} ${m.team2||'?'} ● EN VIVO`);
    });
    const finishedM = Object.values(allMatches[cat]||{}).filter(m=>m.status==='finished');
    finishedM.forEach(m => {
      const s1=Number(m.score1)||0, s2=Number(m.score2)||0;
      const pen = m.penalty ? ` (pen. ${m.pen1}×${m.pen2})` : '';
      parts.push(`${CAT_LABELS[cat]}: ${m.team1||'?'} ${s1} × ${s2} ${m.team2||'?'}${pen}`);
    });
  });

  const ticker = document.getElementById('ticker-inner');
  if (!ticker) return;
  if (parts.length) {
    ticker.textContent = parts.join('   ·   ');
  } else {
    ticker.textContent = 'Torneo de Fútbol CMBP  ·  Resultados en directo';
  }
  // Recalculate animation duration based on text length
  const len = ticker.textContent.length;
  const dur = Math.max(18, Math.min(60, len * 0.22));
  ticker.style.animationDuration = dur + 's';
}

/* ── Auto-fit long team names ── */
function fitTeamNames() {
  document.querySelectorAll('.bk-team-name:not(.tbd)').forEach(el => {
    el.style.fontSize = '';
    if (el.scrollWidth <= el.offsetWidth) return;
    let size = parseFloat(window.getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.offsetWidth + 1 && size > 7) {
      size -= 0.5;
      el.style.fontSize = size + 'px';
    }
  });
}

/* ── Render all ── */
function renderAll() {
  CATEGORIES.forEach(cat => buildBracket(cat));
  buildGoleadores();
  buildTicker();
}

/* ══════════════════════
   EVENT POPUP SYSTEM
══════════════════════ */
const POPUP_DURATION_MS = 5000;
const popupQueue = [];
let popupActive  = false;

function queuePopup(data) {
  popupQueue.push(data);
  if (!popupActive) showNextPopup();
}

function showNextPopup() {
  if (!popupQueue.length) { popupActive = false; return; }
  popupActive = true;
  const data    = popupQueue.shift();
  const overlay = document.getElementById('tv-popup-overlay');
  const popup   = document.getElementById('tv-popup');

  popup.className = `popup-${data.type}`;

  let inner = '';

  if (data.type === 'goal') {
    const ownGoalTag = data.ownGoal ? ' <span style="font-size:0.7rem;color:var(--red);letter-spacing:1px">(en contra)</span>' : '';
    const currentScore = `${Number(data.match.score1)||0} × ${Number(data.match.score2)||0}`;
    // Crowd bars: 14 bars with staggered animation delay
    const crowdBars = Array.from({length:14},(_,i)=>`<div class="goal-crowd-bar" style="--cd:${(i*0.04).toFixed(2)}s;height:${8+Math.round(Math.sin(i*0.7+1)*8)}px"></div>`).join('');
    inner = `
      <div class="goal-flash-overlay"></div>
      <div class="popup-icon">⚽</div>
      <div class="popup-eyebrow">${CAT_LABELS[data.cat]} · ${data.match.code || ''}</div>
      <div class="popup-headline"><span class="popup-goal-headline-anim">GOOOOOL!</span></div>
      <div class="popup-scorer">${data.scorer}${ownGoalTag}</div>
      <div class="popup-team-tag">${data.team}</div>
      <div class="popup-vs">${data.match.team1} &nbsp;×&nbsp; ${data.match.team2}</div>
      <div class="popup-big-score">${currentScore}</div>
      <div class="goal-crowd">${crowdBars}</div>`;
  } else if (data.type === 'live') {
    inner = `
      <div class="popup-icon">🟢</div>
      <div class="popup-eyebrow">${CAT_LABELS[data.cat]}${data.match.time ? ' · ' + data.match.time : ''}</div>
      <div class="popup-headline">EN VIVO</div>
      <div class="popup-match-teams">${data.match.team1}</div>
      <div class="popup-sub" style="font-size:1rem;letter-spacing:4px">VS</div>
      <div class="popup-match-teams">${data.match.team2}</div>`;
  } else if (data.type === 'finished') {
    const w   = getWinner(data.match);
    const pen = data.match.penalty
      ? `<div class="popup-sub">Penales: ${data.match.pen1} × ${data.match.pen2}</div>` : '';
    inner = `
      <div class="popup-icon">🏁</div>
      <div class="popup-eyebrow">${CAT_LABELS[data.cat]} · Resultado final</div>
      <div class="popup-headline">FIN</div>
      <div class="popup-big-score">${Number(data.match.score1)||0} × ${Number(data.match.score2)||0}</div>
      <div class="popup-match-teams">${data.match.team1} <span style="opacity:0.4;font-weight:400">vs</span> ${data.match.team2}</div>
      ${pen}
      ${w ? `<div class="popup-winner-tag">🏆 ${w}</div>` : ''}`;
  }

  popup.innerHTML = inner +
    `<div class="popup-progress"><div class="popup-progress-fill"></div></div>`;

  overlay.classList.add('show');

  // ── Goal burst animation ──
  if (data.type === 'goal') spawnGoalBurst(overlay);

  // Animate progress bar drain (double rAF ensures paint before transition)
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const pf = popup.querySelector('.popup-progress-fill');
    if (pf) {
      pf.style.transition = `width ${POPUP_DURATION_MS}ms linear`;
      pf.style.width = '0%';
    }
  }));

  setTimeout(() => {
    overlay.classList.remove('show');
    setTimeout(() => { popupActive = false; showNextPopup(); }, 450);
  }, POPUP_DURATION_MS);
}

/* ══════════════════════
   FINAL SPLASH
══════════════════════ */
const FINAL_MS = 8000;
let finalActive = false;

function showFinalSplash(cat, match) {
  if (finalActive) return;
  const w = getWinner(match);
  if (!w) return;
  finalActive = true;

  const splash = document.getElementById('final-splash');
  const s1 = Number(match.score1)||0;
  const s2 = Number(match.score2)||0;
  const isW1 = w === match.team1;

  document.getElementById('fs-cat-lbl').textContent   = CAT_LABELS[cat] || cat;
  document.getElementById('fs-winner-name').textContent = w;
  document.getElementById('fs-big-score').textContent   = `${s1} × ${s2}`;

  const t1 = document.getElementById('fs-team1');
  const t2 = document.getElementById('fs-team2');
  t1.textContent = match.team1 || '';
  t2.textContent = match.team2 || '';
  t1.className = 'fs-team'       + (isW1  ? ' champ' : '');
  t2.className = 'fs-team right' + (!isW1 ? ' champ' : '');

  const pen = document.getElementById('fs-pen-note');
  pen.textContent = match.penalty ? `Penales: ${match.pen1} × ${match.pen2}` : '';

  // Confetti
  spawnFinalConfetti(splash);

  // Show
  splash.classList.add('show');

  // Progress bar
  const bar = document.getElementById('fs-progress-fill');
  bar.style.transition = 'none';
  bar.style.width = '100%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    bar.style.transition = `width ${FINAL_MS}ms linear`;
    bar.style.width = '0%';
  }));

  // Pause carousel while visible
  clearTimeout(slideTimeout);

  setTimeout(() => {
    splash.classList.add('out');
    setTimeout(() => {
      splash.classList.remove('show','out');
      splash.querySelectorAll('.fs-confetti-item').forEach(e => e.remove());
      finalActive = false;
      scheduleNext();  // resume carousel
    }, 700);
  }, FINAL_MS);
}

function spawnFinalConfetti(container) {
  const items = ['🎊','🎉','⭐','✨','🏅','🌟','💛','💚','🎖️','🥇','🏆','🎊'];
  const count = 22;
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'fs-confetti-item';
    el.textContent = items[i % items.length];
    el.style.left = (Math.random() * 100) + 'vw';
    el.style.top  = '0';
    el.style.setProperty('--cs',  (1.1 + Math.random() * 1.3).toFixed(1) + 'rem');
    el.style.setProperty('--cd',  (2.2 + Math.random() * 3).toFixed(1)   + 's');
    el.style.setProperty('--cdl', (Math.random() * 2).toFixed(2)          + 's');
    el.style.setProperty('--cr',  (Math.random() * 720 - 360).toFixed(0) + 'deg');
    container.appendChild(el);
  }
}

/* ══════════════════════
   GOAL BURST FUNCTION
══════════════════════ */
function spawnGoalBurst(overlay) {
  const burst = document.createElement('div');
  burst.style.cssText = 'position:absolute;top:50%;left:50%;pointer-events:none;z-index:215;';

  const items = ['⚽','⚽','⚽','⚽','⚽','⚽','⚽','⚽','🎉','🎊','⭐','✨'];
  const count = 12;
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * 360 + (Math.random() * 20 - 10);
    const rad   = angle * Math.PI / 180;
    const dist  = 190 + Math.random() * 190;
    const bx    = Math.cos(rad) * dist;
    const by    = Math.sin(rad) * dist;
    const br    = (Math.random() * 1440 - 720);
    const bdel  = (Math.random() * 0.14).toFixed(2);
    const bdur  = (0.72 + Math.random() * 0.38).toFixed(2);
    const bsize = (1.3 + Math.random() * 0.9).toFixed(1);
    const el    = document.createElement('span');
    el.className = 'goal-burst-item';
    el.style.setProperty('--bx',    bx.toFixed(1)  + 'px');
    el.style.setProperty('--by',    by.toFixed(1)  + 'px');
    el.style.setProperty('--br',    br.toFixed(0)  + 'deg');
    el.style.setProperty('--bdel',  bdel            + 's');
    el.style.setProperty('--bdur',  bdur            + 's');
    el.style.setProperty('--bsize', bsize           + 'rem');
    el.textContent = items[i % items.length];
    burst.appendChild(el);
  }

  overlay.appendChild(burst);
  setTimeout(() => burst.remove(), 1600);
}

/* ══════════════════════
   CHANGE DETECTION
══════════════════════ */
const prevMatchState = {};   // { cat: { matchId: { goalsCount, status } } }
const initialized    = {};   // { cat: boolean } — skip popups on first load

function detectChanges(cat, newData) {
  if (!prevMatchState[cat]) prevMatchState[cat] = {};
  const isFirst = !initialized[cat];

  Object.entries(newData).forEach(([id, m]) => {
    const prev         = prevMatchState[cat][id];
    const newGoalCount = toArr(m.goalsData).length;

    if (!prev) {
      // First time we see this match — record state, no popup
      prevMatchState[cat][id] = { goalsCount: newGoalCount, status: m.status };
      return;
    }

    if (!isFirst) {
      // ── New goal(s) ──
      if (newGoalCount > prev.goalsCount) {
        const goals = toArr(m.goalsData);
        for (let i = prev.goalsCount; i < newGoalCount; i++) {
          const g = goals[i];
          if (g) {
            const teamName = g.teamSlot == 1 ? (m.team1||'Equipo 1') : (m.team2||'Equipo 2');
            queuePopup({ type:'goal', cat, match:m,
              scorer: g.player || '?', team: teamName, ownGoal: !!g.ownGoal });
          }
        }
      }

      // ── Status change ──
      if (m.status !== prev.status) {
        if (m.status === 'live')     queuePopup({ type:'live',     cat, match:m });
        if (m.status === 'finished') {
          queuePopup({ type:'finished', cat, match:m });
          if (m.phase === 'final') showFinalSplash(cat, m);
        }
      }
    }

    // Update recorded state
    prevMatchState[cat][id] = { goalsCount: newGoalCount, status: m.status };
  });

  if (isFirst) initialized[cat] = true;
}

/* ── Firebase subscriptions ── */
CATEGORIES.forEach(cat => {
  onValue(ref(db, `matches/${cat}`), snap => {
    const newData = snap.val() || {};
    detectChanges(cat, newData);       // compare BEFORE updating allMatches
    allMatches[cat] = newData;
    buildBracket(cat);
    requestAnimationFrame(fitTeamNames);
    buildGoleadores();
    buildTicker();
  });
});

/* ══════════════════════
   CAROUSEL LOGIC
══════════════════════ */
function goToSlide(idx) {
  const total = 4;
  const prev = currentSlide;
  currentSlide = ((idx % total) + total) % total;

  // Swap display
  document.getElementById(`slide-${prev}`).classList.remove('active');
  document.getElementById(`slide-${currentSlide}`).classList.add('active');

  // Update dots
  document.querySelectorAll('.hdr-dot').forEach((d,i) => d.classList.toggle('active', i===currentSlide));

  // Update header name
  document.getElementById('hdr-slide-name').textContent = SLIDE_NAMES[currentSlide];

  // Restart progress
  progressStart = Date.now();
  clearTimeout(slideTimeout);
  startProgress();
  scheduleNext();
}

function scheduleNext() {
  clearTimeout(slideTimeout);
  slideTimeout = setTimeout(() => goToSlide(currentSlide + 1), SLIDE_DURATION_MS);
}

function startProgress() {
  cancelAnimationFrame(progressRaf);
  const fill = document.getElementById('progress-fill');
  function tick() {
    const elapsed = Date.now() - progressStart;
    const pct = Math.min(100, (elapsed / SLIDE_DURATION_MS) * 100);
    fill.style.width = pct + '%';
    if (pct < 100) progressRaf = requestAnimationFrame(tick);
  }
  progressRaf = requestAnimationFrame(tick);
}

/* ── Clock ── */
function updateClock() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const clockEl = document.getElementById('clock');
  if (clockEl) clockEl.textContent = `${hh}:${mm}`;
}
updateClock();
setInterval(updateClock, 5000);

/* ── Boot ── */
renderAll();
requestAnimationFrame(fitTeamNames);
scheduleNext();
startProgress();
</script>
